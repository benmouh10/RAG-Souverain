# encoding: utf-8
# ==============================================================================
#  DOCKER COMPOSE — RAG Souverain
#  Orchestration avec réseau isolé + accès Ollama hôte
#  Sprint 8 : Déploiement & Souveraineté
# ==============================================================================



services:
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-souverain
    restart: unless-stopped

    # ── Exposition du port Streamlit ──
    ports:
      - "8501:8501"

    # ── Volumes persistants ──
    # Tout ./data est monté d'un bloc (ChromaDB, rag.db, query_logs.db,
    # bm25_cache.pkl, uploads, evaluation_report.csv...), puis ./data/documents
    # est re-monté en lecture seule par-dessus pour empêcher l'app d'y écrire.
    #
    # AVANT : les fichiers SQLite (rag.db, query_logs.db) et un fichier
    # "active_rag.db" qui ne correspond à AUCUN chemin utilisé par le code
    # (grep introuvable dans app/*.py — mount mort) étaient montés
    # individuellement en tant que fichiers. Docker Compose crée
    # automatiquement le chemin hôte manquant s'il n'existe pas déjà — mais
    # UNIQUEMENT en tant que RÉPERTOIRE, jamais en tant que fichier vide. Au
    # premier `docker compose up` sur une machine neuve (avant qu'aucun
    # ./data/rag.db n'existe sur l'hôte), Docker créait donc un DOSSIER
    # /app/data/rag.db dans le conteneur, et sqlite3.connect() plantait avec
    # "unable to open database file" car il tentait d'ouvrir un répertoire
    # comme fichier de base de données. Monter tout le dossier ./data (qui,
    # lui, existe réellement) élimine ce piège.
    volumes:
      - ./data:/app/data
      - ./data/documents:/app/data/documents:ro

    # ── Accès à Ollama sur la machine hôte ──
    # host.docker.internal pointe vers l'hôte Windows/Mac/Linux
    # Le conteneur peut joindre Ollama via http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ── Variables d'environnement ──
    # `required: false` : un .env absent ne doit pas empêcher `docker compose
    # up` de démarrer (toutes les variables utilisées ont déjà une valeur par
    # défaut ci-dessous ou dans le Dockerfile) — avant, un projet fraîchement
    # cloné sans .env échouait immédiatement avec "env file not found".
    env_file:
      - path: .env
        required: false
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - HF_HOME=/app/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/app/.cache/huggingface
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1

    # ── DNS local forcé pour bloquer toutes les résolutions externes
    dns:
      - 127.0.0.1

    # ── Réseau isolé
    networks:
      - rag_network

    # ── Healthcheck ──
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # ── Ressources ──
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

    # ── Permissions réseau pour iptables (souveraineté) ──
    cap_add:
      - NET_ADMIN


  # ── Service: File Watcher for continuous ingestion ──
  ingestion-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-ingestion-watcher
    restart: unless-stopped
    command: python -m app.ingestion.watcher
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - HF_HOME=/app/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/app/.cache/huggingface
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1
    dns:
      - 127.0.0.1
    networks:
      - rag_network


# ── Reseau isole (cle de la souverainete) ──
# Le conteneur ne peut communiquer qu'avec :
#   1. L'hote via host.docker.internal (Ollama uniquement)
#   2. Les volumes montes (documents, base de donnees)
# Note: internal:true casse le port publishing sur Docker Desktop Windows.
# La souverainete reseau est appliquee via iptables dans le conteneur.
networks:
  rag_network:
    driver: bridge
    name: rag_souverain_network


# ── Volumes ──
# (Using bind mounts for data persistence — no named volumes needed)
