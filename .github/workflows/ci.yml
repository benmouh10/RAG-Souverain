# encoding: utf-8
# ============================================================================
# CI Pipeline — RAG Souverain
# Runs unit tests (no external services needed) then integration tests.
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (parser, chunker, sql)
        run: |
          python -m pytest tests/test_parser.py tests/test_chunker.py tests/test_sql.py -v --tb=short

      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/ -v -m "not integration" --tb=short --cov=app --cov-report=term-missing --cov-fail-under=60

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Ollama
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama is ready"
              exit 0
            fi
            echo "Waiting for Ollama... ($i/30)"
            sleep 2
          done
          echo "Ollama not ready after 60s"
          exit 1

      - name: Run integration tests
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          CHROMA_PERSIST_DIR: /tmp/chroma_test
        run: |
          python -m pytest tests/ -v -m "integration" --tb=short || true
